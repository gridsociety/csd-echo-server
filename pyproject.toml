[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csd-echo-server"
version = "0.1.0"
description = "Answer GSM circuit-switched data (CSD) calls on a serial modem and echo back everything the caller sends"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["csd", "gsm", "modem", "serial", "echo", "at-commands"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: No Input/Output (Daemon)",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Telephony",
  "Topic :: System :: Networking",
]
dependencies = [
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.16",
  "types-pyserial>=3.5,<4",
]

[project.scripts]
csd-echo-server = "csd_echo_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/csd_echo_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
